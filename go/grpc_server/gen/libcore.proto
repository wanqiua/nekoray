syntax = "proto3";

package libcore;
option go_package = "grpc_server/gen";

service LibcoreService {
  rpc Exit(EmptyReq) returns (EmptyResp) {}
  rpc Update(UpdateReq) returns (UpdateResp) {}
  // Both calls use the same authenticated, instance-specific channel as Start.
  rpc Capabilities(EmptyReq) returns (CapabilitiesResp) {}
  // Local preflight only: never starts listeners, TUN, or remote connections.
  rpc Check(LoadConfigReq) returns (CheckResp) {}
  //
  rpc Start(LoadConfigReq) returns (ErrorResp) {}
  rpc Stop(EmptyReq) returns (ErrorResp) {}
  rpc Test(TestReq) returns (TestResp) {}
  rpc QueryStats(QueryStatsReq) returns (QueryStatsResp) {}
  rpc ListConnections(EmptyReq) returns (ListConnectionsResp) {}
}

message EmptyReq {}

message EmptyResp {}

message ErrorResp {
  string error = 1;
}

message LoadConfigReq {
  string core_config = 1;
  bool enable_nekoray_connections = 2;
  repeated string stats_outbounds = 3;
}

enum FailureCategory {
  FailureNone = 0;
  FailureRemote = 1;
  FailureUnsupported = 2;
  FailureConfig = 3;
  FailureCore = 4;
  FailureCancelled = 5;
}

message CapabilitiesResp {
  string core_family = 1;
  string core_version = 2;
  // SHA-256 of the running executable; changes when this build changes.
  string build_id = 3;
  // Positive, compiled capabilities. Full parameter compatibility needs Check.
  repeated string features = 4;
  string source_revision = 5;
  string wrapper_version = 6;
  repeated string build_tags = 7;
}

message CheckResp {
  string error = 1;
  FailureCategory failure_category = 2;
  string core_family = 3;
  string core_version = 4;
  string build_id = 5;
  string config_hash = 6;
}

enum TestMode {
  TcpPing = 0;
  UrlTest = 1;
  FullTest = 2;
}

message TestReq {
  TestMode mode = 1;
  int32 timeout = 6;
  // TcpPing
  string address = 2;
  // UrlTest
  LoadConfigReq config = 3;
  string inbound = 4;
  string url = 5;
  // FullTest
  string in_address = 7;
  bool full_latency = 8;
  bool full_speed = 9;
  string full_speed_url = 13;
  int32 full_speed_timeout = 14;
  bool full_in_out = 10;
  bool full_udp_latency = 12;
  //
  bool full_nat = 11 [deprecated = true];
}

message TestResp {
  string error = 1;
  int32 ms = 2;
  string full_report = 3;
  FailureCategory failure_category = 4;
  string core_family = 5;
  string core_version = 6;
  string build_id = 7;
}

message QueryStatsReq{
  string tag = 1;
  string direct = 2;
}

message QueryStatsResp{
  int64 traffic = 1;
}

enum UpdateAction {
  Check = 0;
  Download = 1;
}

message UpdateReq {
  UpdateAction action = 1;
  bool check_pre_release = 2;
}

message UpdateResp {
  string error = 1;
  string assets_name = 2;
  string download_url = 3;
  string release_url = 4;
  string release_note = 5;
  bool is_pre_release = 6;
}

message ListConnectionsResp {
  string nekoray_connections_json = 1;
}
